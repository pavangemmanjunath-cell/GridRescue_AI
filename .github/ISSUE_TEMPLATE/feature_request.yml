name: Feature request
description: Propose a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: Proposed capability
      description: What should the planner do?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: A concrete site, facility or user story.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: justification
    attributes:
      label: Technical or research justification
      description: Data sources, methods or references that support it.
