name: Bug report
description: Something in the engine, the API or the app gives a wrong or broken result.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Please do not include patient, customer, personal or confidential data.
        Security vulnerabilities go through SECURITY.md, not here.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit (for example v1.0.0 or the commit hash).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and environment
      description: OS, Python and Node.js versions, browser; online or offline (GR_OFFLINE=1).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The site (coordinates), facility inputs and the clicks or API call that show the problem.
      placeholder: |
        1. Pin 6.4684, 7.5256 in the Explorer
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Backend console output, browser console errors or the API response. Remove anything sensitive.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, a better data source, anything else.
